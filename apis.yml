aid: eqt-ventures
name: EQT Ventures
description: >-
  EQT Ventures is the early-stage venture capital business within EQT Group, launched in 2016 and
  operating out of Stockholm with investment-advisory offices in London, Berlin, Paris, Amsterdam,
  and the United States (San Francisco / New York); the funds themselves are domiciled in Luxembourg.
  The firm is a sector-agnostic, conviction-led lead investor that backs what it calls
  "Generation-Defining Companies" from pre-seed and seed through Series A and B, writing checks that
  reported ranges place between roughly EUR 1M and EUR 75M (most commonly EUR 2M-50M) and following on
  as companies scale. EQT Ventures has raised approximately EUR 2.3B across three funds (EQT Ventures I,
  II, and III) and is staffed largely by ex-founders and operators who provide hands-on support in
  addition to capital. Its focus spans AI, SaaS and developer tools, fintech, healthtech, climate and
  deeptech, robotics and aerospace, gaming, and consumer/marketplaces. Notable investments include
  Wolt, Depop, Typeform, AnyDesk, Netlify, Fly.io, Einride, Small Giant Games, Kry, and Beamery.
